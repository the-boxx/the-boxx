name: Android Nightly CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create keystore.properties file for release
      run: |
        echo "storeFile = android.jks" >> keystore.properties
        echo "storePassword = ${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias = ${{ secrets.SIGNING_KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword = ${{ secrets.SIGNING_KEY_PASSWORD }}" >> keystore.properties
      shell: bash

    - name: Restore android.jks
      run: echo ${{ secrets.KEYSTORE_FILE }} | base64 -d > app/android.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew app:assembleRelease
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: boxx-nightly.apk
        path: ./app/build/outputs/apk/release/app-release.apk
        compression-level: 0
