name: Android Release CD

on:
  release:
    types:
      - created
      - draft_created

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create keystore.properties file for release
      run: |
        echo "storeFile = android.jks" >> keystore.properties
        echo "storePassword = ${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias = ${{ secrets.SIGNING_KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword = ${{ secrets.SIGNING_KEY_PASSWORD }}" >> keystore.properties
      shell: bash

    - name: Restore android.jks
      run: echo ${{ secrets.KEYSTORE_FILE }} | base64 -d > app/android.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew app:assembleRelease

    - name: Rename file
      run: mv ./app/build/outputs/apk/release/app-release.apk ./app/build/outputs/apk/release/boxx-release.apk

    - name: Upload artifact to release
      uses: softprops/action-gh-release@v2
      with:
        files: ./app/build/outputs/apk/release/boxx-release.apk